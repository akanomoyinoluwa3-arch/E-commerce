 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Building an E-commerce Product</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="nav-bar">
        <div class="nav-left">
            <h3 class="logo">sneakers</h3>
            <div class="nav-features">
            <div> 
                <p>Collections</p>
            </div>
            <div>
                <p>Men</p>
            </div>
            <div>
                <p>Women</p>
            </div>
            <div>
                <p>About</p>
            </div>
            <div>
                <p>Contacts</p>
            </div>
        </div>
        
        <div nav-right>
            <div class="header-icons">
                <img src="icon-cart.svg" alt="cart-icon">
                 <img src="image-avatar.png" alt="profile img">
            </div>
        </div>        

    </header>
    <main class="Product">
        <div class="Product-container">
            <!--LEFT SIDE-->
            <div class="hero-image">

                <!--Main image-->
               <img src="image-product-1.jpg" alt="sneakers"> 

               <!--Thumbnails underneeath-->
               <div class="thumbnail-container">
                    <img src="image-product-1.jpg" alt="sneakers 1">
                    <img src="image-product-2.jpg" alt="sneakers 2">
                    <img src="image-product-3.jpg" alt="sneakers 3">
                    <img src="image-product-4.jpg" alt="sneakers 4">
                </div>
            </div>
            <!--RIGHT SIDE-->
            <div class="hero-text">
                <p>SNEAKER COMPANY</p>
                <h1>Fall Limited Edition Sneakers</h1>
                <p>These low-profile sneakers are your perfect casual wear comparion.
                     Featuring a duriable rubber outer sole, they'll withstand everything the weather can offer.
                </p>
                <div class="product-price">
                    <div class="price">
                        <h2>$125.00</h2>
                    </div>
                    <span class="discount">50%</span>
                </div>
                
                <p class="old-price">$250.00</p>
    
                <div class="cart-controls">
                    <div class="quantity">
                        <button class="minus">-</button>
                        <span id="quantity">0</span>
                        <button class="plus">+</button>
                    </div>

                    <button class="add-cart">Add to Cart.</button>
                </div>

                

            </div>
        </div>

    </main>
</body>
</html>
